<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agro Care</title>
  <style>
    /* Footer Styles */
    footer {
      background: linear-gradient(135deg, #0077cc, #00b894);
      color: white;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
    }
    .footer-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      max-width: 1000px;
      margin: auto;
    }
    .footer-section {
      flex: 1 1 200px;
      margin: 10px;
    }
    .footer-section h3 {
      margin-bottom: 15px;
      font-size: 18px;
      border-bottom: 2px solid rgba(255,255,255,0.3);
      padding-bottom: 5px;
    }
    .footer-section ul {
      list-style: none;
      padding: 0;
    }
    .footer-section ul li {
      margin: 8px 0;
    }
    .footer-section ul li a {
      color: white;
      text-decoration: none;
      transition: color 0.3s;
    }
    .footer-section ul li a:hover {
      color: #ffeaa7;
    }
    .social-icons {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .social-icons a {
      text-decoration: none;
      color: white;
      font-size: 20px;
      transition: transform 0.3s;
    }
    .social-icons a:hover {
      transform: scale(1.2);
      color: #ffeaa7;
    }
    .footer-bottom {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      border-top: 1px solid rgba(255,255,255,0.3);
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Footer -->
  <footer>
    <div class="footer-container">
      <div class="footer-section">
        <h3>About Agro Care</h3>
        <p>Guiding farmers with knowledge and connecting them to products for a better tomorrow.</p>
      </div>
      <div class="footer-section">
        <h3>Quick Links</h3>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="crops.html">Crops</a></li>
          <li><a href="shopping.html">Shop</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>Follow Us</h3>
        <div class="social-icons">
          <a href="#">🌐</a>
          <a href="#">🐦</a>
          <a href="#">📘</a>
          <a href="#">📸</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      © 2026 Agro Care. All rights reserved.
    </div>
  </footer>

</body>
</html>
